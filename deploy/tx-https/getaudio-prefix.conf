# Include inside the existing HTTPS 443 server. Keep other project includes intact.
# Preserve the full URI: PublicPrefixMiddleware handles the namespace per request.
location = /getaudio { return 308 /getaudio/; }
location ^~ /getaudio/ {
    auth_basic "GetAudio";
    auth_basic_user_file /etc/nginx/getaudio.htpasswd;
    proxy_pass http://127.0.0.1:8800;
    proxy_read_timeout 240s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /getaudio/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8800;
    }
    location = /getaudio/account/platform-auth/douyin/callback {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:8800;
    }
    location ~ ^/getaudio/(account/(register|login|me|logout|platforms|platform-bindings|platform-bindings/(bilibili|douyin)/unbind|platform-auth/(start|status|image|complete|cancel|douyin/callback))$|v2/|agent/v2/) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8800;
    }
}
