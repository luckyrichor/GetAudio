# Deployed on tx, 2026-09-30. Access credential is provisioned separately.
# Business service remains at 127.0.0.1:8800.
server {
    listen 80;
    server_name 43.142.37.199;
    location /.well-known/acme-challenge/ { root /var/lib/getaudio-acme; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name 43.142.37.199;
    ssl_certificate /etc/letsencrypt/live/43.142.37.199/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.142.37.199/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location = /health {
        proxy_pass http://127.0.0.1:8800;
    }
    location / {
        auth_basic "GetAudio";
        auth_basic_user_file /etc/nginx/getaudio.htpasswd;
        proxy_pass http://127.0.0.1:8800;
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
