# Public GetAudio entrance retired to /getaudio/ only, 2026-10-31.
# Production includes for other projects must be preserved when applying this template.
# Business service remains at 127.0.0.1:8800.
server {
    listen 80;
    server_name 43.142.37.199;
    location /.well-known/acme-challenge/ { root /var/lib/getaudio-acme; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name 43.142.37.199;
    ssl_certificate /etc/letsencrypt/live/43.142.37.199/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.142.37.199/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/getaudio-prefix.conf;
    client_max_body_size 1m;
    # No redirect or Basic challenge for obsolete root API routes.
    location / { return 404; }
}
